apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: monitoring
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 91.8.1

    helm:
      releaseName: monitoring

      valuesObject:
        defaultRules:
          create: false

        alertmanager:
          enabled: false

        nodeExporter:
          enabled: false

        kubeStateMetrics:
          enabled: true

        grafana:
          enabled: true
          defaultDashboardsEnabled: false

          service:
            type: ClusterIP

          persistence:
            enabled: false

          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi

        prometheus:
          enabled: true

          prometheusSpec:
            retention: 1d

            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 300m
                memory: 512Mi

        kubelet:
          enabled: true

          serviceMonitor:
            enabled: true
            cAdvisor: true
            probes: true

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true