apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: devops-project
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/omarghonim1/End-to-End-Cloud-Platform.git
    targetRevision: main
    path: infra/k8s

    directory:
      recurse: true

  destination:
    server: https://kubernetes.default.svc
    namespace: devops-project

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true