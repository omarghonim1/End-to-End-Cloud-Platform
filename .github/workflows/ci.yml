name: CI

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: devops-gke-project-510307
  REGION: me-central1
  GAR_REPOSITORY: devops-repo

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          token_format: access_token
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: projects/300411246421/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions
          service_account: github-actions@devops-gke-project-510307.iam.gserviceaccount.com

      - name: Login to Artifact Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build Backend
        run: |
          docker build \
            -t $REGION-docker.pkg.dev/$PROJECT_ID/$GAR_REPOSITORY/devops-backend:${GITHUB_SHA} \
            ./app/backend

      - name: Push Backend
        run: |
          docker push \
            $REGION-docker.pkg.dev/$PROJECT_ID/$GAR_REPOSITORY/devops-backend:${GITHUB_SHA}

      - name: Build Frontend
        run: |
          docker build \
            -t $REGION-docker.pkg.dev/$PROJECT_ID/$GAR_REPOSITORY/devops-frontend:${GITHUB_SHA} \
            ./app/frontend

      - name: Push Frontend
        run: |
          docker push \
            $REGION-docker.pkg.dev/$PROJECT_ID/$GAR_REPOSITORY/devops-frontend:${GITHUB_SHA}