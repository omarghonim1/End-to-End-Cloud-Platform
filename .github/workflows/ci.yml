name: CI

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: write
  id-token: write

env:
  PROJECT_ID: devops-gke-project-510307
  REGION: me-central1
  GAR_REPOSITORY: devops-repo
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          token_format: access_token
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: projects/300411246421/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions
          service_account: github-actions@devops-gke-project-510307.iam.gserviceaccount.com

      - name: Login to Artifact Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build Backend
        run: |
          docker build \
            -t $REGION-docker.pkg.dev/$PROJECT_ID/$GAR_REPOSITORY/devops-backend:$IMAGE_TAG \
            ./app/backend

      - name: Push Backend
        run: |
          docker push \
            $REGION-docker.pkg.dev/$PROJECT_ID/$GAR_REPOSITORY/devops-backend:$IMAGE_TAG

      - name: Build Frontend
        run: |
          docker build \
            -t $REGION-docker.pkg.dev/$PROJECT_ID/$GAR_REPOSITORY/devops-frontend:$IMAGE_TAG \
            ./app/frontend

      - name: Push Frontend
        run: |
          docker push \
            $REGION-docker.pkg.dev/$PROJECT_ID/$GAR_REPOSITORY/devops-frontend:$IMAGE_TAG

      - name: Update Kubernetes image tags
        run: |
          sed -i -E "s|(devops-backend:)[^[:space:]]+|\1${IMAGE_TAG}|" \
            infra/k8s/backend-manifests/backend-deployment.yaml

          sed -i -E "s|(devops-frontend:)[^[:space:]]+|\1${IMAGE_TAG}|" \
            infra/k8s/frontend-manifests/frontend-deployment.yaml

      - name: Commit Kubernetes changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            infra/k8s/backend-manifests/backend-deployment.yaml \
            infra/k8s/frontend-manifests/frontend-deployment.yaml

          if git diff --cached --quiet; then
            echo "No Kubernetes manifest changes."
            exit 0
          fi

          git commit -m "chore: update images to ${IMAGE_TAG}"
          git push